# ── Live Trading Configuration ─────────────────────────────────────────────
# Shifting Iron Condor Strategy on Zerodha NSE F&O
#
# Credentials: set via environment variables (ZERODHA_API_KEY, ZERODHA_API_SECRET,
# ZERODHA_ACCESS_TOKEN) or in the zerodha section below.
# NEVER commit real credentials to version control.

mode: paper   # Set to 'live' to enable real order placement

# ── Capital settings ────────────────────────────────────────────────────────
capital:
  total_capital: 2000000          # ₹20 lakh total deployed capital
  cash_margin_pct: 0.50           # 50% of required margin must be in cash
  max_capital_per_stock: 150000   # Max ₹1.5 lakh per individual stock position
  max_open_positions: 10          # Maximum simultaneously open condors

# ── Strategy parameters (shared across all stocks) ─────────────────────────
strategy:
  shift_trigger_pct: 1.0    # Trigger shift when spot is within 1% of current spot price
  wing_width_pct: 2.0       # Wing width = 2% of spot (long - short distance)
  min_dte: 18               # Minimum days to expiry at entry
  max_dte: 50               # Maximum days to expiry at entry
  entry_start: "09:30"      # Earliest entry time (IST)
  entry_end: "14:00"        # Latest entry time (IST)
  default_lots: 0           # Lots per trade for all stocks (0 = auto-size from capital)
  dte_exit: 2               # Force-close positions when DTE ≤ this (2 = 2 days before expiry)

  # ── Trend classifier (used for logging only) ────────────────────────────
  trend_adx_min: 20.0        # Minimum ADX for trend gate to pass; below → NEUTRAL
  trend_dist_boost: 0.10     # (kept for trend_classifier; no longer applied to distances)

  # ── Fill polling and order timeout ──────────────────────────────────────
  fill_poll_interval_s: 0.5  # Seconds between order status polls for shift legs
  shift_order_timeout_s: 2.0   # cancel and re-place shift leg if not filled within 2 s

  # ── Spot missing alerts ──────────────────────────────────────────────────
  spot_missing_alert_cycles: 4    # Alert after this many consecutive missing-spot cycles

  # ── F&O ban behaviour (Section 7) ───────────────────────────────────────
  allow_dte_exit_during_ban: true  # Allow DTE-triggered exit even if symbol is on ban list

  profit_target_pct: 85.0        # exit when 85% of net premium captured

  # ── Stop-loss controls ───────────────────────────────────────────────────
  stop_loss_credit_multiple:     # exit when loss >= N× entry credit (e.g. 2.0); null = disabled
  stop_loss_inr:                 # exit when loss >= this INR amount; null = disabled
  stop_loss_confirm_checks: 2   # consecutive breach cycles before stop-loss fires

  # ── Daily loss circuit breaker ───────────────────────────────────────────
  max_daily_loss_inr:            # kill switch when session loss >= this INR; null = disabled

  # ── Entry controls ───────────────────────────────────────────────────────
  entry_completion_buffer_min: 20  # don't start new entries within N min of cutoff

  # ── Re-entry and F&O ban ─────────────────────────────────────────────────
  allow_reentry: false             # allow re-entering same symbol+expiry after an exit
  max_fo_ban_suspension_cycles: 2  # exit position after N completed 1-hr ban suspensions

# ── Telegram alert notifications (Section 8) ────────────────────────────────
# Leave blank to disable Telegram alerts. Never commit real tokens.
alerts:
  telegram_bot_token: ""    # Telegram bot token (set via env var or here)
  telegram_chat_id: ""      # Chat/channel ID to send alerts to

# ── Zerodha credentials (prefer env vars over hardcoding here) ──────────────
zerodha:
  api_key: ""               # Set ZERODHA_API_KEY env var instead
  api_secret: ""            # Set ZERODHA_API_SECRET env var instead
  access_token: ""          # Set ZERODHA_ACCESS_TOKEN env var instead (refreshed daily)

# ── Per-stock configurations ─────────────────────────────────────────────────
# put_dist_pct:  Short put distance from spot as % of spot price
# call_dist_pct: Short call distance from spot as % of spot price
# premium_pct:   ENTRY GATE ONLY (0–1 fraction of spread width).
#                Only enter when net_credit / spread_width >= premium_pct.
#                Stock retries every 30 s until entry cutoff if gate not met.
#                NOT the take-profit — exit fires when 85% of original credit captured
#                (controlled by strategy.profit_target_pct).
# enabled:       Set to false to exclude stock from session entries
# expiry_type:   'monthly' = last Thursday of month (default for all stocks)
#                'weekly'  = nearest Thursday in DTE window (for indices like NIFTY)
# expiry_date:   Pin to a specific expiry, e.g. '2026-11-27'. Overrides expiry_type and DTE window.

